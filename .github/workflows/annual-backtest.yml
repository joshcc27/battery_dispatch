name: Annual backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive physical period boundary
        required: true
        default: "2022-07-01 00:00"
      end:
        description: Exclusive physical period boundary
        required: true
        default: "2023-07-01 00:00"
      degradation_cost:
        description: AUD per discharged MWh
        required: true
        default: "25"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: >-
          uv run battery-dispatch
          --start "${{ inputs.start }}"
          --end "${{ inputs.end }}"
          --region SA1
          --connection-point "Hornsdale 275 kV"
          --loss-factor-file config/loss_factors.csv
          --degradation-cost "${{ inputs.degradation_cost }}"
      - uses: actions/upload-artifact@v4
        with:
          name: annual-backtest
          path: outputs/
