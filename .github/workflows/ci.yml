name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run python -m compileall -q src tests scripts
      - run: uv run python scripts/run_fixture.py
      - run: uv run python scripts/run_mutation_checks.py

  reference:
    # The published reference month is re-run and re-audited on every push. It
    # downloads real AEMO data, so it is a separate job from the offline gates.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/verify_reference.py
      - run: uv run python scripts/run_reference_sensitivities.py
      - uses: actions/upload-artifact@v4
        with:
          name: reference-sensitivities
          path: analysis/
